<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Progress Stat</title>
<style>
:root{--bg1:#efe6ff;--bg2:#c9b3f5;--bg3:#a78bfa;--text:#2a1255;--muted:#5b3f99;--glass:rgba(255,255,255,.42);--edge:rgba(255,255,255,.7);--row:rgba(124,58,237,.10);--accent:#7c3aed;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1a0b3a;--bg2:#3b1d7a;--bg3:#6d3fd1;--text:#f3ecff;--muted:#cbb6f5;--glass:rgba(255,255,255,.09);--edge:rgba(255,255,255,.2);--row:rgba(255,255,255,.06);--accent:#a78bfa}}
:root[data-theme="dark"]{--bg1:#1a0b3a;--bg2:#3b1d7a;--bg3:#6d3fd1;--text:#f3ecff;--muted:#cbb6f5;--glass:rgba(255,255,255,.09);--edge:rgba(255,255,255,.2);--row:rgba(255,255,255,.06);--accent:#a78bfa}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);background:radial-gradient(circle at 15% 10%,var(--bg3),transparent 45%),radial-gradient(circle at 90% 90%,var(--bg2),transparent 50%),linear-gradient(135deg,var(--bg1),var(--bg2));background-attachment:fixed}
header{padding:28px 20px 8px;text-align:center}
h1{margin:0;font-size:13px;letter-spacing:.3em;color:var(--muted)}
h2.agent{margin:6px 0 0;font-size:clamp(22px,4vw,34px);letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;padding:16px 20px 100px;max-width:1200px;margin:auto}
.card{background:var(--glass);border:1px solid var(--edge);border-radius:20px;padding:18px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 10px 40px rgba(60,20,120,.25)}
.card h3{margin:0 0 12px;font-size:15px;letter-spacing:.15em;color:var(--muted)}
table{width:100%;border-collapse:separate;border-spacing:0 6px}
td,th{padding:9px 12px;text-align:left;font-size:14px}
th{font-size:11px;letter-spacing:.1em;color:var(--muted);font-weight:600;padding-top:0;padding-bottom:0}
tbody td{background:var(--row)}tbody td:first-child{border-radius:10px 0 0 10px}tbody td:last-child{border-radius:0 10px 10px 0}
td.v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.yes,.no{display:inline-block;padding:3px 12px;border-radius:99px;font-weight:800;font-size:13px}
.yes{background:#22c55e;color:#04210f}.no{background:#ef4444;color:#fff}
tr.miss td{background:rgba(244,114,182,.8);color:#500724}
tr.warn td{background:rgba(234,200,90,.55);color:#3d2e05}
tr.red td{background:rgba(220,38,38,.85);color:#fff}
.edit{width:70px;text-align:right;font:inherit;font-weight:700;color:var(--text);background:rgba(255,255,255,.25);border:1px solid var(--edge);border-radius:8px;padding:3px 6px}
.fab{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:1px solid var(--edge);background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;font-size:26px;cursor:pointer;box-shadow:0 8px 28px rgba(109,40,217,.5)}
.modal{position:fixed;inset:0;background:rgba(20,5,50,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
.modal.on{display:flex}
.panel{background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:20px;width:min(1100px,100%);max-height:88vh;display:flex;flex-direction:column;padding:16px;background-color:rgba(40,15,90,.55);color:#f3ecff}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap}
.bar b{font-size:15px}.bar small{opacity:.75}
.bar button{border:0;border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer;background:#8b5cf6;color:#fff;margin-left:6px}
.sheet{overflow:auto;border-radius:10px;background:#fff}
.sheet table{border-collapse:collapse;border-spacing:0;width:max-content;color:#111}
.sheet td,.sheet th{border:1px solid #d9d4e8;padding:4px 8px;font-size:12.5px;min-width:90px;height:26px;white-space:nowrap;background:#fff}
.sheet th{background:#ece6fb;color:#4c2a99;text-align:center;position:sticky;top:0}
.sheet td.n{background:#ece6fb;color:#4c2a99;min-width:34px;text-align:center;position:sticky;left:0}
.sheet tr:first-of-type td:not(.n){font-weight:700;background:#f6f2ff}
.sheet td:focus{outline:2px solid #7c3aed;outline-offset:-2px}

header{position:relative}
.switch{border:1px solid var(--edge);background:var(--glass);color:var(--text);border-radius:12px;padding:9px 14px;font-weight:800;font-size:12px;letter-spacing:.08em;cursor:pointer;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.switch.left{position:absolute;top:22px;left:20px}
@keyframes shake{0%{transform:translateX(0)}4%{transform:translateX(-6px)}8%{transform:translateX(6px)}12%{transform:translateX(-6px)}16%{transform:translateX(6px)}20%{transform:translateX(-3px)}24%{transform:translateX(3px)}28%,100%{transform:translateX(0)}}
#toCsat{animation:shake 1.5s ease-in-out infinite}
#toCsat:hover{animation:none}
@media (prefers-reduced-motion:reduce){#toCsat{animation:none}}
@media (max-width:560px){.switch.left{position:static;display:block;margin:0 auto 10px 0}}
#csat{z-index:20;align-items:flex-start;overflow:auto;background:radial-gradient(circle at 15% 10%,var(--bg3),transparent 45%),radial-gradient(circle at 90% 90%,var(--bg2),transparent 50%),linear-gradient(135deg,var(--bg1),var(--bg2))}
#csModal{z-index:25}
.lbwrap{width:min(1200px,100%);margin:3vh auto 40px;padding:0 4px 90px}
.lbtop{display:flex;justify-content:flex-start;margin-bottom:6px}
.csTitle{margin:6px 0 2px;text-align:center;font-size:clamp(22px,4vw,32px);letter-spacing:.06em}
.csSub{text-align:center;color:var(--muted);letter-spacing:.12em;font-size:13px;font-weight:700}
.note{text-align:center;font-size:13px;color:var(--muted);min-height:18px;margin-top:8px}
.csgrid{display:grid;gap:18px;padding:14px 0}
.scroll{overflow-x:auto}
.cst{min-width:560px}.cst.wide{min-width:760px}
.cst th{text-align:center;vertical-align:bottom;padding:0 12px 6px;white-space:normal;line-height:1.3}
.cst td,.cst td.v{text-align:center}
.cst td.bad{background:rgba(220,38,38,.85);color:#fff}
.bar button.ghostb{background:transparent;border:1px solid var(--edge)}
</style></head><body>
<header><button class="switch left" id="toCsat">SWITCH CSAT VIEW</button><h1>PROGRESS STAT</h1><h2 class="agent" id="agent"></h2></header>
<div class="grid">
<div class="card"><h3>MTD TABLE</h3><table id="mtd"></table></div>
<div class="card"><h3>SALES TABLE</h3><table id="sales"></table></div>
<div class="card"><h3>KPI TABLE</h3><table id="kpi"></table></div>
</div>
<button class="fab" id="fab" title="Open data sheet" aria-label="Open data sheet">&#128214;</button>
<div class="modal" id="modal"><div class="panel">
<div class="bar"><div><b>Data sheet</b> <small>Click a cell and paste (Ctrl+V) your Excel data, headers in row 1</small></div>
<div><button id="export" class="ghostb" title="Download data.json to publish for everyone">Export data</button><button id="clear">Clear</button><button id="close">Done</button></div></div>
<div class="sheet" id="sheet"></div></div></div>
<div class="modal" id="csat"><div class="lbwrap">
<div class="lbtop"><button class="switch" id="csBack">SWITCH PROGRESS VIEW</button></div>
<h2 class="csTitle">CSAT VIEW</h2><div class="csSub" id="csName"></div>
<div class="note" id="csNote"></div>
<div class="csgrid" id="csTables"></div>
<button class="fab" id="csFab" title="Open CSAT data sheet" aria-label="Open CSAT data sheet">&#128214;</button>
</div></div>
<div class="modal" id="csModal"><div class="panel">
<div class="bar"><div><b>CSAT data</b> <small id="csHint"></small></div>
<div><button id="csAddRows" class="ghostb">+ Rows</button><button id="csAddCols" class="ghostb">+ Cols</button><button id="csT1">Surveys</button><button id="csT2" class="ghostb">Calls</button><button id="csExport" class="ghostb" title="Download csat.json to publish for everyone">Export data</button><button id="csClear" class="ghostb">Clear</button><button id="csClose">Done</button></div></div>
<div class="sheet" id="csSheet"></div></div></div>
<script>
const AGENT="JEDDAH MAE DESCARTIN";
const HDR=["Agent Name","Voice Answered","Voice Answered AHT","Voice CSAT","Voice FCR","Voice Agent Resolution","Voice Answered Take Rate (calibrated)","Voice Answered Transfer to Survey % (calibrated)","Voice Handled Transfer % (calibrated)","Status - Pay to Performance","Voice Sentiment Trend Avg","Revenue - Bookings (Post Recoup)","Revenue - ACQ + CROSS (Post Recoup)","Revenue - REN (Post Recoup)"];
const SAMPLE=["Jeddah Mae Descartin","198","1536","4.96","87.20%","92.30%","40.90%","61.10%","3.90%","88%","28.71","4739","2040","2700"];
const PCT=["voicefcr","voiceagentresolution","voiceansweredtakeratecalibrated","voiceansweredtransfertosurveycalibrated","voicehandledtransfercalibrated","statuspaytoperformance"];
let data=[HDR.slice(),SAMPLE.slice()],days={w:22,s:22,a:0,l:0},localTs=0,dayTs=0,pubTs=0;
try{const d=JSON.parse(localStorage.getItem("ps_data")||"null");if(d&&d.length)data=d;const k=JSON.parse(localStorage.getItem("ps_days")||"null");if(k)days=Object.assign(days,k);localTs=+localStorage.getItem("ps_ts")||0;dayTs=+localStorage.getItem("ps_dts")||0}catch(e){}
const save=k=>{if(k==="x")localTs=Date.now();if(k==="d")dayTs=Date.now();try{localStorage.setItem("ps_data",JSON.stringify(data));localStorage.setItem("ps_days",JSON.stringify(days));localStorage.setItem("ps_ts",String(localTs));localStorage.setItem("ps_dts",String(dayTs))}catch(e){}};
const norm=s=>String(s==null?"":s).toLowerCase().replace(/[^a-z0-9]/g,"");
const colIdx=n=>(data[0]||[]).findIndex(h=>norm(h)===norm(n));
const getRow=()=>{const i=colIdx("Agent Name");return i<0?null:data.slice(1).find(r=>norm(r[i])===norm(AGENT))};
function num(n){const r=getRow(),i=colIdx(n);if(!r||i<0)return NaN;const s=String(r[i]==null?"":r[i]).trim();if(!s)return NaN;let v=parseFloat(s.replace(/[$,%\s]/g,""));if(isNaN(v))return NaN;if(PCT.includes(norm(n))&&(s.includes("%")||v>1))v/=100;return v}
const ok=v=>!isNaN(v);
const P=v=>ok(v)?(v*100).toFixed(1)+"%":"—";
const N=(v,d=0)=>ok(v)?v.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d}):"—";
const $=v=>ok(v)?"$"+N(v,2):"—";
const tier=(v,list,dir,last)=>{if(!ok(v))return NaN;for(const[t,s]of list){if(dir>0?v>=t:v<=t)return s}return last};
const sc={
aht:v=>tier(v,[[920,1],[930,.9],[939,.8],[949,.7],[959,.6]],-1,.5),
csat:v=>tier(v,[[4.96,1.1],[4.93,1],[4.89,.9],[4.85,.8]],1,.5),
res:v=>tier(v,[[.97,1.1],[.94,1],[.92,.9],[.9,.8],[.871,.7]],1,.5),
trf:v=>tier(v,[[.12,1.1],[.129,1],[.139,.9],[.145,.8],[.149,.7]],-1,.5),
pay:v=>tier(v,[[.87,1.1],[.83,1],[.8,.9],[.77,.8],[.75,.7],[.73,.6]],1,.5)};
const lv=(v,t)=>{if(!ok(v))return"";const r=v/t;return r>=.9?"":r>=.8?"warn":"miss"};
const ahtC=v=>ok(v)&&v>920?"miss":"";
const xfC=v=>ok(v)&&v<.55?"red":"";
const row3=(a,b,c,m)=>`<tr${m?' class="'+m+'"':''}><td>${a}</td><td class="v">${b}</td>${c===undefined?"":`<td class="v">${c}</td>`}</tr>`;
const badge=q=>q===null?"—":`<span class="${q?"yes":"no"}">${q?"YES":"NO"}</span>`;
function render(){
document.getElementById("agent").textContent=AGENT;
const ans=num("Voice Answered"),aht=num("Voice Answered AHT"),csat=num("Voice CSAT"),fcr=num("Voice FCR"),res=num("Voice Agent Resolution"),take=num("Voice Answered Take Rate (calibrated)"),trf=num("Voice Answered Transfer to Survey % (calibrated)"),pay=num("Status - Pay to Performance"),book=num("Revenue - Bookings (Post Recoup)"),acq=num("Revenue - ACQ + CROSS (Post Recoup)"),ren=num("Revenue - REN (Post Recoup)");
document.getElementById("mtd").innerHTML="<thead><tr><th>METRIC</th><th style='text-align:right'>SCORE</th></tr></thead><tbody>"+
row3("CALLS",N(ans))+row3("AHT",N(aht),undefined,ahtC(aht))+row3("CSAT",N(csat,2),undefined,lv(csat,4.93))+row3("VRR",P(res),undefined,lv(res,.94))+row3("FCR",P(fcr))+row3("TAKE RATE",P(take),undefined,lv(take,.33))+row3("XFER TO SURVEY",P(trf),undefined,xfC(trf))+row3("TRANSFERS%",P(num("Voice Handled Transfer % (calibrated)")))+row3("P2P",P(pay),undefined,lv(pay,.83))+"</tbody>";
const tot=ok(acq)&&ok(ren)?acq+ren:NaN,pc=ok(acq)&&ok(ans)&&ans?acq/ans:NaN;
const miss=ok(pc)?(pc<9?9*ans-acq:0):NaN;
let inc=NaN;if(ok(book)){inc=0;const K=[500,1000,2000,3000,3500,4000,4500,5000,5500,6000,6500,7000],V=[1750,3250,4750,5000,5100,5250,5750,6250,6500,7000,7500,8000];K.forEach((k,i)=>{if(book>=k)inc=V[i]})}
const kick=ok(book)?Math.round(Math.max(book-7000,0)*0.035*60.59*100)/100:NaN;
const q1=ok(take)&&ok(csat)&&ok(pc)?(take>=.33&&csat>=4.9&&pc>=9):null;
document.getElementById("sales").innerHTML="<thead><tr><th>METRIC</th><th style='text-align:right'>VALUE</th></tr></thead><tbody>"+
row3("ACQ",$(acq))+row3("RENEWAL",$(ren))+row3("TOTAL",$(tot))+
row3("$/CALL",$(pc),undefined,lv(pc,9))+row3("Missing ACQ (target $9/call)",$(miss),undefined,lv(pc,9))+row3("INCENTIVES",$(inc))+row3("KICKER",$(kick))+row3("QUALIFIED?",badge(q1))+"</tbody>";
const s=[sc.aht(aht),sc.csat(csat),sc.res(res),sc.trf(num("Voice Handled Transfer % (calibrated)")),sc.pay(pay)];
const abn=n=>n===0?1:n===1?.75:n===2?.5:0;
const s7=s.concat([abn(days.a),abn(days.l)]);
const pcnt=s7.every(ok)?s[1]*.2+s[0]*.25+s[2]*.25+s[4]*.15+s[3]*.05+s7[5]*.05+s7[6]*.05:NaN;
const mult=days.s?days.w/days.s:NaN;
const q2=ok(take)&&ok(csat)&&ok(pc)?(take>=.33&&csat>=4.9&&pc>=9):null;
const sp=v=>ok(v)?Math.round(v*100)+"%":"—";
const ab=n=>n===0?"100%":n===1?"75%":n===2?"50%":"0%";
document.getElementById("kpi").innerHTML="<thead><tr><th>METRIC</th><th style='text-align:right'>ACTUAL</th><th style='text-align:right'>SCORE</th></tr></thead><tbody>"+
`<tr><td>Days Worked</td><td class="v" colspan="2"><input class="edit" type="number" min="0" id="dw" value="${days.w}"></td></tr>`+
`<tr><td>Days Scheduled</td><td class="v" colspan="2"><input class="edit" type="number" min="0" id="ds" value="${days.s}"></td></tr>`+
row3("AHT",N(aht),sp(s[0]),ahtC(aht))+row3("CSAT",N(csat,2),sp(s[1]),lv(csat,4.93))+row3("VRR",P(res),sp(s[2]),lv(res,.94))+row3("TRANSFER%",P(num("Voice Handled Transfer % (calibrated)")),sp(s[3]))+row3("P2P",P(pay),sp(s[4]),lv(pay,.83))+
`<tr><td>ABSENCE</td><td class="v"><input class="edit" type="number" min="0" id="da" value="${days.a}"></td><td class="v">${ab(days.a)}</td></tr>`+`<tr><td>LATE</td><td class="v"><input class="edit" type="number" min="0" id="dl" value="${days.l}"></td><td class="v">${ab(days.l)}</td></tr>`+row3("MULTIPLIER","",sp(mult))+row3("PERCENTAGE","",sp(pcnt))+row3("INITIAL KPI","",$((p=>ok(p)?(p>=.95?5250:p>=.9?5000:p>=.87?4500:p>=.85?2500:p>=.8?1975:0):NaN)(Math.round(pcnt*1e6)/1e6)))+row3("FINAL KPI","",$((p=>ok(p)&&ok(mult)?mult*(p>=.95?5250:p>=.9?5000:p>=.87?4500:p>=.85?2500:p>=.8?1975:0):NaN)(Math.round(pcnt*1e6)/1e6)))+row3("QUALIFIED?","",badge(q2))+"</tbody>";
const dw=document.getElementById("dw"),ds=document.getElementById("ds");
dw.oninput=()=>{days.w=parseFloat(dw.value)||0;save("d");render();document.getElementById("dw").focus()};
ds.oninput=()=>{days.s=parseFloat(ds.value)||0;save("d");render();document.getElementById("ds").focus()};
document.getElementById("da").oninput=e=>{days.a=Math.max(0,parseInt(e.target.value)||0);save("d");render();document.getElementById("da").focus()};
document.getElementById("dl").oninput=e=>{days.l=Math.max(0,parseInt(e.target.value)||0);save("d");render();document.getElementById("dl").focus()};
}
const colName=c=>{let s="";c++;while(c>0){const m=(c-1)%26;s=String.fromCharCode(65+m)+s;c=Math.floor((c-1)/26)}return s};
function grid(){
const R=Math.max(data.length+8,22),C=Math.max(114,...data.map(r=>r.length));
let h="<table><thead><tr><th></th>";
for(let c=0;c<C;c++)h+=`<th>${colName(c)}</th>`;
h+="</tr></thead><tbody>";
for(let r=0;r<R;r++){h+=`<tr><td class="n">${r+1}</td>`;for(let c=0;c<C;c++){const v=(data[r]&&data[r][c])||"";h+=`<td contenteditable="true" data-r="${r}" data-c="${c}">${String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;")}</td>`}h+="</tr>"}
document.getElementById("sheet").innerHTML=h+"</tbody></table>";
}
const sheet=document.getElementById("sheet");
sheet.addEventListener("input",e=>{const t=e.target;if(!t.dataset||t.dataset.r===undefined)return;const r=+t.dataset.r,c=+t.dataset.c;while(data.length<=r)data.push([]);data[r][c]=t.textContent;save("x");render()});
sheet.addEventListener("paste",e=>{const t=e.target.closest("td[data-r]");if(!t)return;e.preventDefault();
const txt=(e.clipboardData||window.clipboardData).getData("text");
const rows=clipRows(e);
const r0=+t.dataset.r,c0=+t.dataset.c;
if(r0===0&&c0===0)data=[];
rows.forEach((cells,i)=>{while(data.length<=r0+i)data.push([]);cells.forEach((v,j)=>{data[r0+i][c0+j]=v.trim()})});
save("x");grid();render()});
const modal=document.getElementById("modal");
document.getElementById("fab").onclick=()=>{grid();modal.classList.add("on")};
document.getElementById("close").onclick=()=>{modal.classList.remove("on");render()};
document.getElementById("clear").onclick=()=>{data=[[]];save("x");grid();render()};
modal.addEventListener("click",e=>{if(e.target===modal){modal.classList.remove("on");render()}});

/* ---------- Shared helpers ---------- */
const g=id=>document.getElementById(id);
function parseTSV(t){const rows=[];let row=[],f="",q=false;t=t.replace(/\r/g,"");
for(let i=0;i<t.length;i++){const ch=t[i];
 if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
 else if(ch==='"'&&f==="")q=true;
 else if(ch==="\t"){row.push(f);f=""}
 else if(ch==="\n"){row.push(f);rows.push(row);row=[];f=""}
 else f+=ch}
if(f!==""||row.length){row.push(f);rows.push(row)}
return rows}
/* Paste reader: uses the clipboard's HTML table when present (like Excel does, keeps empty cells), else tab text, else one-cell-per-line text */
const SURVEY_HEAD=["Agent Name","Reports to","Case ID","Knowledgeable rating","Courteous rating","FCR value","CSAT value","Comments","Date"];
function parseFlat(txt){
const L=txt.replace(/\r/g,"").split("\n").map(x=>x.trim()).filter(x=>x!=="");
if(L.length<SURVEY_HEAD.length||!SURVEY_HEAD.every((h,i)=>norm(L[i])===norm(h)))return parseTSV(txt);
const isNum=x=>/^\d+(\.\d+)?$/.test(x),isFcr=x=>/^(yes|no)\./i.test(x),isName=x=>/^[a-z]+\.[a-z]+$/i.test(x);
const out=[SURVEY_HEAD.slice()];let i=SURVEY_HEAD.length;
while(i<L.length){
 if(!(isName(L[i])&&L[i+1]&&!isNum(L[i+1]))){i++;continue}
 let j=i+1;while(j<L.length&&!(isName(L[j])&&L[j+1]&&!isNum(L[j+1])&&j>i+1))j++;
 const rec=L.slice(i,j),agent=rec[0],rep=rec[1],cid=rec[2]||"",rest=rec.slice(3);
 const di=rest.map(x=>/^\d+\/\d+\/\d+/.test(x)).lastIndexOf(true),date=di>=0?rest[di]:"",mid=di>=0?rest.slice(0,di):rest;
 const fi=mid.findIndex(isFcr),fcr=fi>=0?mid[fi]:"";
 const before=(fi>=0?mid.slice(0,fi):mid).filter(isNum),after=fi>=0?mid.slice(fi+1).filter(isNum):[];
 let q1="",q2="",cs="";
 if(fi>=0){q1=before[0]||"";q2=before[1]||"";cs=after[0]||""}
 else if(before.length>=3){q1=before[0];q2=before[1];cs=before[2]}
 else{q1=before[0]||"";q2=before[1]||""}
 const cm=mid.filter(x=>!isNum(x)&&!isFcr(x)).join(" ");
 out.push([agent,rep,cid,q1,q2,fcr,cs,cm,date]);i=j}
return out}
function clipRows(e){
const cd=e.clipboardData||window.clipboardData,html=cd.getData("text/html");
if(html&&/<t[dh][\s>]/i.test(html)){
 const trs=[...new DOMParser().parseFromString(html,"text/html").querySelectorAll("tr")];
 if(trs.length)return trs.map(tr=>{const o=[];[...tr.children].forEach(td=>{if(!/^t[dh]$/i.test(td.tagName))return;o.push((td.textContent||"").replace(/\s+/g," ").trim());for(let k=1;k<(parseInt(td.getAttribute("colspan"))||1);k++)o.push("")});return o})}
const txt=cd.getData("text");
return txt.includes("\t")?parseTSV(txt):parseFlat(txt)}
const download=(obj,name,msg)=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(obj)],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);alert(name+" downloaded.\n\nUpload it to your GitHub repo (same folder as index.html) and replace the old "+name+". "+msg)};
const isMe=s=>{const n=norm(s);return n.includes("jeddah")&&n.includes("descartin")};   // survey usernames like jeddah.descartin
let xRows=30,xCols=40;
const grow=(el,redraw,r,c)=>{const t=el.scrollTop,l=el.scrollLeft;xRows+=r;xCols+=c;redraw();el.scrollTop=t;el.scrollLeft=l};

/* ---------- CSAT VIEW (single agent) ---------- */
const CS={csat:4.93,take:.33,vrr:.94,fcr:.88};
const FCRN=["Yes. resolved in one interaction","Yes. but it took more than one interaction.","No. this is my first interaction and it is not resolved.","No. I have contacted you more than once and it is still not resolved."].map(norm);
let cs={surveys:[],calls:[]},csLocalTs=0,csTab="surveys";
try{const d=JSON.parse(localStorage.getItem("ps_cs")||"null");if(d){cs.surveys=d.surveys||[];cs.calls=d.calls||[];csLocalTs=+d.ts||0}}catch(e){}
const csSave=()=>{csLocalTs=Date.now();try{localStorage.setItem("ps_cs",JSON.stringify({surveys:cs.surveys,calls:cs.calls,ts:csLocalTs}))}catch(e){}};
function csRender(){
g("csName").textContent=AGENT;
let q1s=0,q1n=0,q2s=0,q2n=0,f=[0,0,0,0],seen=0;
const hs=(cs.surveys[0]||[]).map(norm),ai=hs.indexOf("agentname"),ki=hs.indexOf("knowledgeablerating"),ci=hs.indexOf("courteousrating"),fi=hs.indexOf("fcrvalue");
if(ai>=0)for(let r=1;r<cs.surveys.length;r++){const row=cs.surveys[r]||[];if(!isMe(row[ai]))continue;seen++;
 if(ki>=0){const v=parseFloat(row[ki]);if(ok(v)){q1s+=v;q1n++}}
 if(ci>=0){const v=parseFloat(row[ci]);if(ok(v)){q2s+=v;q2n++}}
 if(fi>=0){const j=FCRN.indexOf(norm(row[fi]));if(j>=0)f[j]++}}
// Calls tab: Agent Name + Calls; if empty, falls back to Voice Answered from the main data sheet
const hc=(cs.calls[0]||[]).map(norm);let nc=hc.indexOf("agentname");if(nc<0)nc=hc.indexOf("name");if(nc<0)nc=0;
let cc=-1;["calls","voiceanswered","numberofcalls"].some(k=>(cc=hc.indexOf(k))>=0);if(cc<0)cc=1;
let calls=NaN;cs.calls.forEach(row=>{if(!isMe((row||[])[nc]))return;const v=parseFloat(String(row[cc]==null?"":row[cc]).replace(/,/g,""));if(ok(v))calls=(ok(calls)?calls:0)+v});
if(!ok(calls))calls=num("Voice Answered");
const avg=(s,n)=>n?s/n:NaN,r2=v=>ok(v)?Math.round((v+1e-9)*100)/100:NaN;   // round half up (4.896 -> 4.90)
const a1=avg(q1s,q1n),a2=avg(q2s,q2n),csat=r2(ok(a1)&&ok(a2)?(a1+a2)/2:NaN),take=ok(calls)&&calls>0?q1n/calls:NaN;
const t=f[0]+f[1]+f[2]+f[3],fcr=t?f[0]/t:NaN,vrr=t?(f[0]+f[1])/t:NaN;
const need=!t||fcr>=CS.fcr?"—":N(Math.ceil(Number(((CS.fcr*t-f[0])/(1-CS.fcr)).toFixed(9))));
const bad=(v,x)=>ok(v)&&v<x,c=(v,fl)=>`<td class="v${fl?" bad":""}">${v}</td>`;
const tb=(cls,heads,cells)=>`<div class="scroll"><table class="cst ${cls}"><thead><tr>${heads.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody><tr>${cells.join("")}</tr></tbody></table></div>`;
g("csTables").innerHTML=
`<div class="card"><h3>CSAT &amp; TAKE RATE</h3>${tb("",["CALLS","SURVEY","Q1","Q2","CSAT","TAKE RATE"],[c(N(calls)),c(N(q1n)),c(N(r2(a1),2)),c(N(r2(a2),2)),c(N(csat,2),bad(csat,CS.csat)),c(P(take),bad(take,CS.take))])}</div>`+
`<div class="card"><h3>FCR &amp; VRR</h3>${tb("wide",["Q1","Q2","Q3","Q4","VRR","FCR","SURVEYS NEEDED"],[...f.map(n=>c(n?N(n):"")),c(P(vrr),bad(vrr,CS.vrr)),c(P(fcr),bad(fcr,CS.fcr)),c(need)])}</div>`;
g("csNote").textContent=cs.surveys.length<=1?"No survey data yet. Tap the book button and paste the survey sheet.":(ai<0||ki<0||ci<0||fi<0)?"Survey columns not found. Paste with headers in row 1 (Agent Name, Knowledgeable rating, Courteous rating, FCR value).":!seen?"No survey rows found for Jeddah (looking for a name containing “jeddah” and “descartin”).":"";
}
function csGrid(){
const arr=cs[csTab],R=arr.length+xRows,C=Math.max(xCols,...arr.map(r=>r.length+1));
let h="<table><thead><tr><th></th>";for(let k=0;k<C;k++)h+=`<th>${colName(k)}</th>`;h+="</tr></thead><tbody>";
for(let r=0;r<R;r++){h+=`<tr><td class="n">${r+1}</td>`;for(let k=0;k<C;k++){const v=(arr[r]&&arr[r][k])||"";h+=`<td contenteditable="true" data-r="${r}" data-c="${k}">${String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;")}</td>`}h+="</tr>"}
g("csSheet").innerHTML=h+"</tbody></table>";
g("csHint").textContent=csTab==="surveys"?"Click A1 and paste the survey export (replaces old data), headers in row 1.":"Click A1 and paste Agent Name + Calls, headers in row 1 (optional: uses Voice Answered if empty).";
}
function csSetTab(k){csTab=k;g("csT1").className=k==="surveys"?"":"ghostb";g("csT2").className=k==="calls"?"":"ghostb";csGrid()}
g("csT1").onclick=()=>csSetTab("surveys");g("csT2").onclick=()=>csSetTab("calls");
g("csAddRows").onclick=()=>grow(g("csSheet"),csGrid,25,0);g("csAddCols").onclick=()=>grow(g("csSheet"),csGrid,0,10);
g("csFab").onclick=()=>{csGrid();g("csModal").classList.add("on")};
const csClose=()=>{g("csModal").classList.remove("on");csRender()};
g("csClose").onclick=csClose;
g("csModal").addEventListener("click",e=>{if(e.target===g("csModal"))csClose()});
g("csSheet").addEventListener("input",e=>{const t=e.target;if(!t.dataset||t.dataset.r===undefined)return;const arr=cs[csTab],r=+t.dataset.r,k=+t.dataset.c;while(arr.length<=r)arr.push([]);arr[r][k]=t.textContent;csSave();csRender()});
g("csSheet").addEventListener("paste",e=>{
const t=e.target.closest("td[data-r]");if(!t)return;e.preventDefault();
const rows=clipRows(e);
const arr=cs[csTab],r0=+t.dataset.r,c0=+t.dataset.c;
if(r0===0&&c0===0)arr.length=0;
rows.forEach((cells,i)=>{while(arr.length<=r0+i)arr.push([]);cells.forEach((v,j)=>{arr[r0+i][c0+j]=String(v).trim()})});
csSave();csGrid();csRender()});
g("csClear").onclick=()=>{if(!confirm("Clear the "+csTab+" data? Viewers keep the old file until you export again."))return;cs[csTab]=[];csSave();csGrid();csRender()};
// Export keeps only Jeddah's rows and the 4 columns the tables need
function csSlim(){const h=cs.surveys[0]||[],ni=h.findIndex(x=>norm(x)==="agentname"),idx=["agentname","knowledgeablerating","courteousrating","fcrvalue"].map(w=>h.findIndex(x=>norm(x)===w));
if(idx.some(i=>i<0))return cs.surveys;return cs.surveys.filter((r,i)=>i===0||isMe((r||[])[ni])).map(r=>idx.map(i=>(r||[])[i]==null?"":r[i]))}
g("csExport").onclick=()=>download({updated:Date.now(),surveys:csSlim(),calls:cs.calls.filter((r,i)=>i===0||(r||[]).some(isMe))},"csat.json","Everyone sees the update within a minute or two of opening the page.");
function loadCsat(){
if(location.protocol==="file:")return;
fetch("csat.json?v="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{
if(!j||!Array.isArray(j.surveys))return;
const before=JSON.stringify(cs);
if((+j.updated||0)>=csLocalTs){cs.surveys=j.surveys;cs.calls=Array.isArray(j.calls)?j.calls:[]}
if(g("csat").classList.contains("on")&&!g("csModal").classList.contains("on")&&JSON.stringify(cs)!==before)csRender();
}).catch(()=>{});
}

/* ---------- Main data: export + published data.json ---------- */
g("export").onclick=()=>{const i=colIdx("Agent Name");download({updated:Date.now(),data:data.filter((r,k)=>k===0||(i>=0&&norm((r||[])[i])===norm(AGENT))),days:days},"data.json","Everyone sees the update within a minute or two of opening the page.")};
function loadPub(){
if(location.protocol==="file:")return;
fetch("data.json?v="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{
if(!j||!Array.isArray(j.data)||!j.data.length)return;
const before=JSON.stringify([data,days]);pubTs=+j.updated||0;
if(pubTs>=localTs)data=j.data;
if(j.days&&pubTs>=dayTs)days=Object.assign({w:22,s:22,a:0,l:0},j.days);
const typing=document.activeElement&&document.activeElement.classList.contains("edit");
if(JSON.stringify([data,days])!==before&&!modal.classList.contains("on")&&!typing)render();
}).catch(()=>{});
}

/* ---------- Routing: #csat opens the CSAT view ---------- */
function route(){const on=location.hash==="#csat";g("csat").classList.toggle("on",on);g("csModal").classList.remove("on");if(on)csRender()}
addEventListener("hashchange",route);
g("toCsat").onclick=()=>{location.hash="csat"};
g("csBack").onclick=()=>{location.hash=""};
route();loadPub();loadCsat();
setInterval(()=>{loadPub();loadCsat()},60000);
render();
</script></body></html>
